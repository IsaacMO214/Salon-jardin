<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap"
    rel="stylesheet" />
  <title>Salón Jardín Fantasy</title>
</head>

<body>
  <!-- Skeleton Load Instantáneo -->
  <div id="initial-skeleton"
    style="min-height: 100vh; background-color: #F9FAF9; display: flex; flex-direction: column; overflow: hidden; animation: initialPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; font-family: sans-serif; position: absolute; inset: 0; z-index: 9999;">
    <style>
      @keyframes initialPulse {

        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: .7;
        }
      }

      .skel-nav-items {
        display: none;
      }

      @media (min-width: 768px) {
        .skel-nav-items {
          display: flex;
          gap: 1.5rem;
        }
      }
    </style>

    <!-- Navbar Skeleton -->
    <div
      style="height: 5rem; width: 100%; background-color: #fff; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; flex-shrink: 0; box-sizing: border-box;">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div style="width: 2.5rem; height: 2.5rem; background-color: #e2e8f0; border-radius: 9999px;"></div>
        <div style="width: 8rem; height: 1.5rem; background-color: #e2e8f0; border-radius: 9999px;"></div>
      </div>
      <div class="skel-nav-items">
        <div style="width: 5rem; height: 1rem; background-color: #e2e8f0; border-radius: 9999px;"></div>
        <div style="width: 5rem; height: 1rem; background-color: #e2e8f0; border-radius: 9999px;"></div>
        <div style="width: 5rem; height: 1rem; background-color: #e2e8f0; border-radius: 9999px;"></div>
        <div style="width: 5rem; height: 1rem; background-color: #e2e8f0; border-radius: 9999px;"></div>
      </div>
      <div
        style="width: 2.5rem; height: 2.5rem; background-color: #e2e8f0; border-radius: 9999px; display: block; @media (min-width: 768px) { display: none; }">
      </div>
    </div>

    <!-- Hero Skeleton -->
    <div
      style="width: 100%; height: 70vh; background-color: rgba(226, 232, 240, 0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; box-sizing: border-box; padding: 2rem;">
      <div
        style="width: 75%; max-width: 48rem; height: 4rem; background-color: rgba(203, 213, 225, 0.8); border-radius: 1rem;">
      </div>
      <div
        style="width: 50%; max-width: 32rem; height: 2rem; background-color: rgba(203, 213, 225, 0.8); border-radius: 9999px;">
      </div>
      <div
        style="width: 12rem; height: 3rem; background-color: rgba(203, 213, 225, 0.8); border-radius: 9999px; margin-top: 1.5rem;">
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
